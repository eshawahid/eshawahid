name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=1e3a8a&color_dots=161b22,1e3a5f,1d4ed8,2563eb,38bdf8&color_background=0d1117
            dist/github-contribution-grid-snake-dark.svg?color_snake=1e3a8a&color_dots=161b22,1e3a5f,1d4ed8,2563eb,38bdf8&color_background=0d1117

      - name: Push snake animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
